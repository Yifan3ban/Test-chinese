name: samples
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/samples.yml']
concurrency:
  group: samples
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  samples:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install edge-tts
      - run: which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: write script
        run: |
          cat > /tmp/s.py <<'PY'
          import asyncio, os, json, re, time, subprocess, hashlib, urllib.request, urllib.parse
          OUT = 'out_s'; os.makedirs(OUT + '/edge', exist_ok=True); os.makedirs(OUT + '/wm', exist_ok=True)
          STEP = os.environ.get('STEP')
          LOG = open(OUT + f'/log_{STEP}.txt', 'w', encoding='utf-8')
          def log(*a):
              s = ' '.join(str(x) for x in a); print(s, flush=True); LOG.write(s + '\n'); LOG.flush()
          SAMPLES = ['你好', '谢谢', '俄国', '欧元', '星期二', '电话号码', '我们俩', '我觉得语法不太难，汉字很难。']
          if STEP == 'edge':
              import edge_tts
              VOICES = ['zh-CN-XiaoxiaoNeural', 'zh-CN-XiaoyiNeural', 'zh-CN-YunjianNeural', 'zh-CN-YunxiNeural', 'zh-CN-YunxiaNeural', 'zh-CN-YunyangNeural']
              async def edge():
                  for v in VOICES:
                      for r in ['-20%', '-35%']:
                          for i, t in enumerate(SAMPLES):
                              for k in range(4):
                                  try:
                                      await edge_tts.Communicate(t, v, rate=r).save(f'{OUT}/edge/{v}_{r[1:3]}_{i}.mp3'); break
                                  except Exception as e:
                                      log('edge retry', v, r, t, e); await asyncio.sleep(3)
              asyncio.run(edge()); log('edge done')
              raise SystemExit
          UA = {'User-Agent': 'Yifan3ban-chinese-trainer/1.0 (https://github.com/Yifan3ban; educational, low volume)'}
          def get(url):
              for k in range(6):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=60) as r:
                          time.sleep(1.0); return r.read()
                  except urllib.error.HTTPError as e:
                      w = int(e.headers.get('Retry-After') or 0) or 20 * (k + 1)
                      log('HTTP', e.code, 'wait', w, url[:120]); time.sleep(min(w, 120))
                  except Exception as e:
                      log('ERR', e, url[:120]); time.sleep(10)
              return None
          def api(host, **q):
              q.update(format='json', formatversion='2', maxlag='5')
              b = get(f'https://{host}/w/api.php?' + urllib.parse.urlencode(q))
              try: return json.loads(b) if b else {}
              except Exception: return {}
          words = [l.rstrip('\n').split('\t', 1)[1] for l in open('tts_list.txt', encoding='utf-8') if '\t' in l]
          allw = list(dict.fromkeys(words + list('人大小多少好吃喝水茶热冷爱想看听说读写买卖开坐住去来回走跑洗穿书门窗钱块贵菜肉鱼猫狗花山叫岁年月号请会能太很都也不没快慢长远近新累忙饿渴女绿鞋手脚唱跳笑哭睡站找给送借进出擦药灯酸甜苦辣咸香脏难换带拿放关树草河海湖马鸟蛇红黄蓝白黑紫头嘴牙腿脸饭汤梨桃糖盐油醋酒桥路街船点刻做用等问停爬飞游骑挂推拉扔捡数画种养抱高矮胖瘦老重轻深浅宽窄亮暗软硬湿满空对错真假半早晚久旧梦票包碗刀床墙楼风雨雪云雷火牛羊猪鸡鸭比只再又还就才刚讲寄岛粥个本件张条双把班搬办被笔变遍别冰饼病层尝场吵城迟春次从戴当低底丢东懂短段队而翻分份赶敢各跟更刮光逛过汗厚坏极交教角接节紧句棵克课口困懒离里俩连两辆零留乱每米男南您弄怕拍陪篇骗瓶破千前穷秋取却让谁省剩收帅死算它她抬谈躺趟疼提题铁挺脱外完玩万往忘为位喂无西先响像向些信行醒姓修选呀页夜阴银赢右与元越照之指祝转赚字租左座蛋二家九六面旁七晴日三十四天五要一有在这最够熊诗输递我你他了的是儿吗上到得学吧哪几下和王八车那李帮话考国打着明记生呢安娜们卫百网么杯试子丽束列餐厢折名周样兴事时吹友改竹球见乘将旅途购物然觉聊拳步纸感付起色副道地第室宫保丁证唯宝川台认经自气丈中奶京词造院定舍文于爸啡便踢后店斤毛电林支啊灰全屋知馆欢朋房客午期汉馒局谢工果校秘俄易弟师英间语法码绍美杂身机今妹姐公韩介妈港容民北德邮哥昨啤堂币同言体授较习识苹星宜志发迎方作欧食音夫医已咖部田己结入由决宿闻加')))
          W = set(allw); res = {w: [] for w in allw}
          # 1) Lingua Libre Mandarin category, listed 500 at a time
          cont = {}; n = 0
          while True:
              d = api('commons.wikimedia.org', action='query', list='categorymembers', cmtitle='Category:Lingua Libre pronunciation-cmn', cmtype='file', cmlimit='500', **cont)
              for m in (d.get('query') or {}).get('categorymembers', []):
                  t = m['title'].split(':', 1)[1]; n += 1
                  g = re.search(r'-([^-]+)\.(wav|ogg|mp3|flac)$', t)
                  if g and g.group(1) in W: res[g.group(1)].append(t)
              if 'continue' not in d: break
              cont = {'cmcontinue': d['continue']['cmcontinue']}
          log('LL files', n, 'words found', sum(1 for v in res.values() if v))
          # 2) Wiktionary pages, 50 titles per request
          AUD = re.compile(r'\.(ogg|oga|wav|mp3|flac|opus)$', re.I)
          for i in range(0, len(allw), 50):
              ch = allw[i:i + 50]; cont = {}
              while True:
                  d = api('en.wiktionary.org', action='query', prop='images', titles='|'.join(ch), imlimit='max', **cont)
                  for p in (d.get('query') or {}).get('pages', []):
                      for im in p.get('images', []) or []:
                          t = im['title'].split(':', 1)[1]
                          if AUD.search(t) and re.match(r'^(Zh|Cmn)[- ]', t, re.I) and p['title'] in res and t not in res[p['title']]:
                              res[p['title']].append(t)
                  if 'continue' not in d: break
                  cont = {k: v for k, v in d['continue'].items()}
          log('after wiktionary, words found', sum(1 for v in res.values() if v), 'of', len(allw))
          json.dump(res, open(OUT + '/wm_index.json', 'w', encoding='utf-8'), ensure_ascii=False, indent=0)
          # 3) download a small sample only (8 test words + 30 others)
          pick = [w for w in SAMPLES if res.get(w)] + [w for w in allw if res[w] and w not in SAMPLES][:30]
          files = {}
          for w in pick:
              for j, t in enumerate(res[w][:3]):
                  b = get('https://commons.wikimedia.org/wiki/Special:FilePath/' + urllib.parse.quote(t.replace(' ', '_')))
                  if not b: continue
                  raw = OUT + '/wm/tmp'; open(raw, 'wb').write(b)
                  o = f'{OUT}/wm/' + hashlib.md5(w.encode()).hexdigest()[:12] + f'_{j}.mp3'
                  if subprocess.run(['ffmpeg', '-v', 'error', '-y', '-i', raw, '-ac', '1', '-ar', '24000', '-b:a', '48k', o]).returncode == 0:
                      files.setdefault(w, []).append([t, os.path.basename(o)])
                  os.remove(raw)
          json.dump(files, open(OUT + '/wm_files.json', 'w', encoding='utf-8'), ensure_ascii=False, indent=0)
          log('sample downloaded', len(files))

          PY
      - name: voices
        run: STEP=edge python /tmp/s.py
      - name: save voices
        if: always()
        run: |
          [ -d out_s ] || exit 0
          rm -rf /tmp/br && git clone -q --depth 1 -b tts-samples2 "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" /tmp/br 2>/dev/null || (mkdir -p /tmp/br && cd /tmp/br && git init -q && git checkout -q -b tts-samples2)
          cp -r out_s/. /tmp/br/
          cd /tmp/br
          git add .
          git -c user.name=tts -c user.email=tts@users.noreply.github.com commit -qm samples || exit 0
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" tts-samples2
      - name: wikimedia
        continue-on-error: true
        run: STEP=wm python /tmp/s.py
      - name: save wikimedia
        if: always()
        run: |
          [ -d out_s ] || exit 0
          rm -rf /tmp/br && git clone -q --depth 1 -b tts-samples2 "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" /tmp/br 2>/dev/null || (mkdir -p /tmp/br && cd /tmp/br && git init -q && git checkout -q -b tts-samples2)
          cp -r out_s/. /tmp/br/
          cd /tmp/br
          git add .
          git -c user.name=tts -c user.email=tts@users.noreply.github.com commit -qm samples || exit 0
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" tts-samples2
